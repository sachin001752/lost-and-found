<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost and Found - Registration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f2f5;
        }

        .page-wrapper {
            display: flex;
            width: 1000px;
            max-width: 95vw;
            min-height: 700px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            margin: 20px auto;
        }

        .side-image {
            flex: 1.2;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.7) 0%, rgba(76, 75, 162, 0.7) 100%),
                url('lost_found_community_joy_1769861242415.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 40px;
            text-align: center;
        }

        .side-content h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .side-content p {
            font-size: 16px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .registration-container {
            width: 450px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        @media (max-width: 950px) {
            .page-wrapper {
                width: 100%;
                max-width: 100%;
                margin: 0;
                border-radius: 0;
                flex-direction: column;
                min-height: 100vh;
            }

            .side-image {
                display: none;
            }

            .registration-container {
                width: 100%;
                padding: 40px 20px;
                flex: 1;
            }

            .gender-group {
                flex-direction: column;
                gap: 10px;
            }

            #camera-video {
                max-width: 90%;
            }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .gender-group {
            display: flex;
            gap: 20px;
        }

        input[type="radio"] {
            width: auto;
            margin-right: 5px;
        }

        .radio-label {
            display: inline;
            margin-bottom: 0;
            font-weight: normal;
        }

        .btn-register {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .success-message {
            color: #27ae60;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .photo-capture-container {
            margin-bottom: 20px;
            text-align: center;
        }

        .photo-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #eee;
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 3px solid #667eea;
            position: relative;
        }

        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        .photo-btn {
            padding: 8px 15px;
            font-size: 13px;
            border-radius: 5px;
            cursor: pointer;
            border: 1px solid #ddd;
            background: #f8f9fa;
            transition: all 0.3s;
        }

        .photo-btn:hover {
            background: #eee;
        }

        #camera-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            padding: 20px;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #camera-video {
            width: 100%;
            max-width: 500px;
            max-height: 70vh;
            border-radius: 15px;
            background: black;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        .camera-controls {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }
    </style>
</head>

<body>
    <div class="page-wrapper">
        <div class="side-image">
            <div class="side-content">
                <h2>Bring Back the Smile !</h2>
                <p>Join a community where honesty lives. Help others find what they've lost, and let the community help
                    you in return. It only takes a minute to make a difference.</p>
            </div>
        </div>
        <div class="registration-container">
            <div class="logo-section">
                <div class="logo">🔍</div>
                <h1>Lost & Found</h1>
                <p class="subtitle">Create an account to get started</p>
            </div>

            <form id="registrationForm">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <div class="gender-group">
                        <input type="radio" id="male" name="gender" value="male">
                        <label for="male" class="radio-label">Male</label>
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female" class="radio-label">Female</label>
                    </div>
                </div>

                <div class="photo-capture-container">
                    <label>Profile Photo</label>
                    <div class="photo-preview" id="photo-preview-box">
                        <span id="photo-placeholder">👤</span>
                        <img id="preview-img" style="display: none;">
                    </div>
                    <div class="photo-buttons">
                        <button type="button" class="photo-btn" id="take-photo-btn"><i class="fas fa-camera"></i> Take a
                            Photo</button>
                        <button type="button" class="photo-btn" id="upload-photo-btn"><i class="fas fa-upload"></i> Add
                            a Photo</button>
                    </div>
                    <input type="file" id="user_photo" name="user_photo" accept="image/*" style="display: none;">
                    <input type="hidden" id="captured_photo" name="captured_photo">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <div class="form-group" id="otpGroup" style="display: none;">
                    <label for="otp">Enter OTP (Sent to your email)</label>
                    <input type="text" id="otp" name="otp" placeholder="Enter 6-digit OTP" maxlength="6">
                </div>

                <button type="submit" class="btn-register" id="submitBtn">Register</button>

                <div class="error-message" id="errorMsg"></div>
                <div class="success-message" id="successMsg"></div>
            </form>

            <div class="login-link">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>

    <!-- Camera Modal -->
    <div id="camera-modal">
        <video id="camera-video" autoplay playsinline></video>
        <div class="camera-controls">
            <button type="button" class="btn-register" id="capture-btn"
                style="width: auto; padding: 10px 30px;">Capture</button>
            <button type="button" class="btn-register" id="close-camera-btn"
                style="width: auto; padding: 10px 30px; background: #666;">Close</button>
        </div>
        <canvas id="camera-canvas" style="display: none;"></canvas>
    </div>

    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <script>const registrationForm = document.getElementById('registrationForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const otpGroup = document.getElementById('otpGroup');
        const submitBtn = document.getElementById('submitBtn');

        // Photo Handling
        const takePhotoBtn = document.getElementById('take-photo-btn');
        const uploadPhotoBtn = document.getElementById('upload-photo-btn');
        const userPhotoInput = document.getElementById('user_photo');
        const capturedPhotoInput = document.getElementById('captured_photo');
        const photoPreviewBox = document.getElementById('photo-preview-box');
        const photoPlaceholder = document.getElementById('photo-placeholder');
        const previewImg = document.getElementById('preview-img');

        const cameraModal = document.getElementById('camera-modal');
        const cameraVideo = document.getElementById('camera-video');
        const cameraCanvas = document.getElementById('camera-canvas');
        const captureBtn = document.getElementById('capture-btn');
        const closeCameraBtn = document.getElementById('close-camera-btn');

        let stream = null;

        uploadPhotoBtn.onclick = () => userPhotoInput.click();

        userPhotoInput.onchange = function () {
            const file = this.files[0];

            if (file) {
                const reader = new FileReader();

                reader.onload = function (e) {
                    previewImg.src = e.target.result;
                    previewImg.style.display = 'block';
                    photoPlaceholder.style.display = 'none';
                    capturedPhotoInput.value = ''; // Clear captured photo if file is uploaded
                }

                reader.readAsDataURL(file);
            }
        }

            ;

        takePhotoBtn.onclick = async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: true
                });
                cameraVideo.srcObject = stream;
                cameraModal.style.display = 'flex';
            }

            catch (err) {
                alert('Could not access camera: ' + err.message);
            }
        }

            ;

        captureBtn.onclick = () => {
            const context = cameraCanvas.getContext('2d');
            cameraCanvas.width = cameraVideo.videoWidth;
            cameraCanvas.height = cameraVideo.videoHeight;
            context.drawImage(cameraVideo, 0, 0, cameraCanvas.width, cameraCanvas.height);

            const imageData = cameraCanvas.toDataURL('image/jpeg');
            previewImg.src = imageData;
            previewImg.style.display = 'block';
            photoPlaceholder.style.display = 'none';
            capturedPhotoInput.value = imageData;
            userPhotoInput.value = ''; // Clear file input if photo is captured

            stopCamera();
        }

            ;

        closeCameraBtn.onclick = stopCamera;

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            cameraModal.style.display = 'none';
        }

        let isOtpSent = false;

        registrationForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            if (!isOtpSent) {
                const formData = new FormData(registrationForm);

                try {
                    const response = await fetch('register.php', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();

                    if (data.success) {
                        isOtpSent = true;
                        successMsg.textContent = data.message;
                        successMsg.style.display = 'block';
                        otpGroup.style.display = 'block';
                        submitBtn.textContent = 'Verify OTP';

                        registrationForm.querySelectorAll('input:not(#otp)').forEach(input => input.readOnly = true);
                        registrationForm.querySelectorAll('input[type="radio"]').forEach(input => input.disabled = true);
                        document.querySelectorAll('.photo-btn').forEach(btn => btn.disabled = true);
                    }

                    else {
                        errorMsg.textContent = data.message;
                        errorMsg.style.display = 'block';
                    }
                }

                catch (error) {
                    errorMsg.textContent = 'Registration failed. Please try again.';
                    errorMsg.style.display = 'block';
                }
            }

            else {
                const otp = document.getElementById('otp').value;
                const email = document.getElementById('email').value;

                if (!otp || otp.length !== 6) {
                    errorMsg.textContent = 'Please enter a valid 6-digit OTP';
                    errorMsg.style.display = 'block';
                    return;
                }

                try {
                    const formData = new FormData();
                    formData.append('email', email);
                    formData.append('otp', otp);

                    const response = await fetch('verify_otp.php', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();

                    if (data.success) {
                        successMsg.textContent = data.message;
                        successMsg.style.display = 'block';

                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }

                            , 2000);
                    }

                    else {
                        errorMsg.textContent = data.message;
                        errorMsg.style.display = 'block';
                    }
                }

                catch (error) {
                    errorMsg.textContent = 'Verification failed. Please try again.';
                    errorMsg.style.display = 'block';
                }
            }
        });
    </script>
</body>

</html>
