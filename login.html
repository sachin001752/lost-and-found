<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost and Found - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f2f5;
        }

        .page-wrapper {
            display: flex;
            width: 900px;
            max-width: 95vw;
            min-height: 600px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .side-image {
            flex: 1;
            background: linear-gradient(135deg, rgba(76, 75, 162, 0.7) 0%, rgba(102, 126, 234, 0.7) 100%),
                url('lost_found_community_joy_1769861242415.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 40px;
            text-align: center;
        }

        .side-content h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .side-content p {
            font-size: 16px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .login-container {
            width: 450px;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        @media (max-width: 850px) {
            .page-wrapper {
                width: 100%;
                max-width: 100%;
                margin: 0;
                border-radius: 0;
                flex-direction: column;
                min-height: 100vh;
            }

            .side-image {
                display: none;
            }

            .login-container {
                width: 100%;
                padding: 40px 20px;
                flex: 1;
            }

            .admin-link-top {
                top: 10px;
                right: 10px;
                padding: 8px 15px;
                font-size: 12px;
            }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .success-message {
            color: #27ae60;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .admin-link-top {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 10px 20px;
            border-radius: 30px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-link-top:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            background: #f8f9fa;
        }

        .admin-link-top::before {
            content: '⚙️';
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="page-wrapper">
        <div class="side-image">
            <div class="side-content">
                <h2>Reunite with Joy</h2>
                <p>Log in to track your items and connect with kind hearts. Every second counts when it comes to
                    bringing your belongings back home.</p>
            </div>
        </div>
        <div class="login-container">
            <div class="logo-section">
                <div class="logo">🔍</div>
                <h1>Lost & Found</h1>
                <p class="subtitle">Find what you lost, help others find theirs</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn-login">Login</button>

                <div class="error-message" id="errorMsg"></div>
                <div class="success-message" id="successMsg"></div>
            </form>

            <div class="signup-link">
                Don't have an account? <a href="registration.html">Sign up here</a>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');

        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            // Get form data
            const formData = new FormData(loginForm);

            try {
                const response = await fetch('login.php', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    successMsg.textContent = data.message;
                    successMsg.style.display = 'block';

                    // Store user session info
                    localStorage.setItem('loggedInUser', data.user.email);
                    localStorage.setItem('userName', data.user.name);

                    // Redirect after 1.5 seconds
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    errorMsg.textContent = data.message;
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.textContent = 'Login failed. Please try again.';
                errorMsg.style.display = 'block';
            }
        });

        // Check if already logged in or if no users exist
        window.addEventListener('load', async function () {
            try {
                // Check if any users exist at all
                const countRes = await fetch('get_user_count.php');
                const countData = await countRes.json();
                if (countData.success && countData.count === 0) {
                    console.log('No users found in database, redirecting to registration');
                    window.location.href = 'registration.html';
                    return;
                }

                const response = await fetch('get_items.php');
                const data = await response.json();
                if (data.success) {
                    // User is logged in
                    window.location.href = 'index.html';
                }
            } catch (error) {
                // Not logged in or error, stay on login page
            }
        });
    </script>
</body>

</html>
