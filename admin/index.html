<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Lost & Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .card {
            width: 100%;
            max-width: 1100px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .card-header {
            padding: 25px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card-header h2 {
            margin: 0;
            font-size: 24px;
        }

        .card-header-subtitle {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .card-body {
            padding: 30px;
        }

        .login-box {
            max-width: 420px;
            margin: 0 auto;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 16px;
            transition: border-color 0.3s;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn.secondary {
            background: #e74c3c;
        }

        .btn.secondary:hover {
            transform: translateY(-2px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .tag {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            background: #667eea;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .small {
            font-size: 13px;
            color: #666;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .form-row {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 15px;
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 10px;
            padding: 10px;
            background: #ffe6e6;
            border-radius: 5px;
        }

        .success-message {
            color: #27ae60;
            font-size: 13px;
            margin-top: 10px;
            padding: 10px;
            background: #e6f7e6;
            border-radius: 5px;
        }

        .item-details {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .item-image {
            flex: 1;
            min-width: 260px;
        }

        .item-image img {
            width: 100%;
            border-radius: 8px;
            max-height: 400px;
            object-fit: cover;
        }

        .item-image-placeholder {
            width: 100%;
            height: 300px;
            border-radius: 8px;
            background: #f0f2f8;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
        }

        .item-info {
            flex: 2;
            min-width: 260px;
        }

        .item-info h3 {
            margin: 0 0 15px 0;
            font-size: 22px;
            color: #333;
        }

        .info-row {
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .info-label {
            font-weight: 600;
            color: #667eea;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            flex-wrap: wrap;
        }

        .nav-tab {
            padding: 10px 16px;
            background: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            font-size: 14px;
        }

        .nav-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .nav-tab:hover {
            color: #667eea;
        }

        .user-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-info {
            flex: 1;
            min-width: 250px;
        }

        .user-info p {
            margin: 5px 0;
            font-size: 14px;
        }

        .user-info .user-name {
            font-weight: 600;
            font-size: 16px;
            color: #333;
        }

        .verification-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .verified {
            background: #d4edda;
            color: #155724;
        }

        .unverified {
            background: #fff3cd;
            color: #856404;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
            float: left;
            border: 2px solid #ddd;
        }

        .user-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            margin: 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: 700;
            margin: 10px 0 0 0;
        }

        .filter-panel {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-panel input,
        .filter-panel select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 13px;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-resolved {
            background: #d4edda;
            color: #155724;
        }

        .status-closed {
            background: #f8d7da;
            color: #721c24;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .modal-header h3 {
            margin: 0;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .activity-log {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .activity-item {
            padding: 10px;
            border-left: 3px solid #667eea;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .activity-time {
            color: #999;
            font-size: 12px;
        }

        @media (max-width: 800px) {
            body {
                padding: 10px;
            }

            .card {
                border-radius: 0;
            }

            .card-header {
                padding: 20px;
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .card-body {
                padding: 15px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                width: 100%;
            }

            .search-box {
                width: 100%;
            }

            .item-details {
                flex-direction: column;
            }

            .header-actions {
                width: 100%;
                justify-content: center;
            }

            .form-row {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <div class="card" id="app">
        <div class="card-header">
            <div>
                <h2>Admin Dashboard</h2>
                <div class="card-header-subtitle">Manage user submissions</div>
            </div>
            <div id="adminActions"></div>
        </div>

        <div class="card-body" id="bodyContent">
            <!-- Login will be injected here when not authenticated -->
        </div>
    </div>

    <script>
        // Hardcoded admin credentials (change here if you want)
        const ADMIN_EMAIL = 'admin@me.com';
        const ADMIN_PASSWORD = 'admin1234';
        let currentTab = 'submissions';
        let activityLog = JSON.parse(localStorage.getItem('adminActivityLog')) || [];
        let allSubmissions = []; // Global storage for fetched items

        function logActivity(action) {
            const timestamp = new Date().toLocaleString();
            activityLog.unshift({ action, timestamp });
            if (activityLog.length > 100) activityLog.pop();
            localStorage.setItem('adminActivityLog', JSON.stringify(activityLog));
        }

        function isAdminLogged() {
            return sessionStorage.getItem('isAdmin') === 'true';
        }

        function showLogin() {
            const html = `
                <div class="login-box">
                    <form id="adminLoginForm">
                        <h3 style="margin-bottom: 20px; text-align: center;">Admin Login</h3>
                        <label for="adminEmail">Admin Email</label>
                        <input id="adminEmail" name="email" type="email" placeholder="admin@me.com" value="" required />
                        <label for="adminPass">Password</label>
                        <input id="adminPass" name="password" type="password" placeholder="Enter password" required />
                        <div style="display:flex;gap:10px;margin-top:20px">
                            <button type="submit" class="btn" style="flex: 1;">Login</button>
                            <button type="button" class="btn secondary" id="backBtn" style="flex: 1;">Back</button>
                        </div>
                        <div id="loginMsg" class="small error-message" style="display:none;"></div>
                    </form>
                </div>
            `;
            document.getElementById('bodyContent').innerHTML = html;
            document.getElementById('adminLoginForm').addEventListener('submit', adminLogin);
            document.getElementById('backBtn').addEventListener('click', () => { window.location.href = '../index.html' });
        }

        async function adminLogin(e) {
            e.preventDefault();
            const msg = document.getElementById('loginMsg');
            msg.style.display = 'none';

            const formData = new FormData(document.getElementById('adminLoginForm'));

            try {
                const response = await fetch('admin_login.php', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    sessionStorage.setItem('isAdmin', 'true');
                    sessionStorage.setItem('adminEmail', data.admin.email);
                    logActivity('Admin logged in');
                    renderDashboard();
                } else {
                    msg.textContent = data.message;
                    msg.style.display = 'block';
                }
            } catch (error) {
                msg.textContent = 'Login failed. Please try again.';
                msg.style.display = 'block';
            }
        }

        function logoutAdmin() {
            logActivity('Admin logged out');
            sessionStorage.removeItem('isAdmin');
            sessionStorage.removeItem('adminEmail');
            showLogin();
        }

        async function getStatistics() {
            try {
                const response = await fetch('admin_get_stats.php');
                const data = await response.json();

                if (data.success) {
                    return data.stats;
                } else {
                    console.error('Failed to get statistics:', data.message);
                    return {
                        totalSubmissions: 0,
                        lostItems: 0,
                        foundItems: 0,
                        totalUsers: 0,
                        verifiedUsers: 0,
                        unverifiedUsers: 0
                    };
                }
            } catch (error) {
                console.error('Error fetching statistics:', error);
                return {
                    totalSubmissions: 0,
                    lostItems: 0,
                    foundItems: 0,
                    totalUsers: 0,
                    verifiedUsers: 0,
                    unverifiedUsers: 0
                };
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            if (tab === 'submissions') renderDashboard();
            else if (tab === 'losters') renderLostersTab();
            else if (tab === 'finders') renderFindersTab();
            else if (tab === 'match') renderMatchTab();
            else if (tab === 'analytics') renderAnalyticsTab();
            else if (tab === 'settings') renderSettings();
        }

        async function getAllUsers() {
            try {
                const response = await fetch('admin_get_users.php');
                const data = await response.json();

                if (data.success) {
                    return data.users.map(user => ({
                        id: user.id,
                        name: user.name,
                        email: user.email,
                        photo: user.photo,
                        phone: user.phone || 'N/A',
                        lost: Array(user.lost_count).fill({}),
                        found: Array(user.found_count).fill({}),
                        verified: user.verified
                    }));
                } else {
                    console.error('Failed to get users:', data.message);
                    return [];
                }
            } catch (error) {
                console.error('Error fetching users:', error);
                return [];
            }
        }

        async function getLostersUsers() {
            const users = await getAllUsers();
            return users.filter(u => u.lost.length > 0);
        }

        async function getFindersUsers() {
            const users = await getAllUsers();
            return users.filter(u => u.found.length > 0);
        }

        async function toggleUserVerification(userId) {
            try {
                const formData = new FormData();
                formData.append('user_id', userId);

                const response = await fetch('admin_toggle_verification.php', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    logActivity(`User "${data.user_name}" verification toggled to ${data.verified}`);
                    if (currentTab === 'losters') renderLostersTab();
                    else if (currentTab === 'finders') renderFindersTab();
                    else if (currentTab === 'users') renderUserManagement();
                } else {
                    alert('Failed to toggle verification: ' + data.message);
                }
            } catch (error) {
                console.error('Error toggling verification:', error);
                alert('Failed to toggle verification. Please try again.');
            }
        }

        function searchItems(query, items) {
            const lowerQuery = query.toLowerCase();
            return items.filter(item =>
                item.title.toLowerCase().includes(lowerQuery) ||
                item.category.toLowerCase().includes(lowerQuery) ||
                item.location.toLowerCase().includes(lowerQuery) ||
                item.user.toLowerCase().includes(lowerQuery) ||
                item.description.toLowerCase().includes(lowerQuery)
            );
        }

        function filterItems(items, filters) {
            let filtered = items;

            if (filters.type) {
                filtered = filtered.filter(i => i.type === filters.type || i.type.toLowerCase() === filters.type.toLowerCase());
            }
            if (filters.category) {
                filtered = filtered.filter(i => i.category === filters.category);
            }
            if (filters.status) {
                // Check local property first as database returns it
                filtered = filtered.filter(i => (i.status || 'Pending') === filters.status);
            }

            return filtered;
        }

        async function renderMatchTab() {
            currentTab = 'match';

            try {
                const response = await fetch('admin_get_all_items.php');
                const data = await response.json();

                if (!data.success) {
                    console.error('Failed to items for matching:', data.message);
                    return;
                }

                const items = data.items;
                const lostItems = items.filter(i => i.type === 'Lost' || i.type === 'lost');
                const foundItems = items.filter(i => i.type === 'Found' || i.type === 'found');

                // Calculate match scores
                const matchedPairs = [];
                lostItems.forEach(lost => {
                    foundItems.forEach(found => {
                        const score = calculateMatchScore(lost, found);
                        if (score > 0) {
                            matchedPairs.push({
                                lost,
                                found,
                                score,
                                matched: localStorage.getItem(`matched_${lost.id}_${found.id}`) === 'true'
                            });
                        }
                    });
                });

                // Sort by score descending
                matchedPairs.sort((a, b) => b.score - a.score);

                const html = `
                <div class="nav-tabs">
                    <button class="nav-tab" onclick="switchTab('submissions')">📋 Submissions</button>
                    <button class="nav-tab" onclick="switchTab('losters')">🔍 Losters</button>
                    <button class="nav-tab" onclick="switchTab('finders')">📦 Finders</button>
                    <button class="nav-tab active" onclick="switchTab('match')">🔗 Match Items</button>
                    <button class="nav-tab" onclick="switchTab('analytics')">📊 Analytics</button>
                    <button class="nav-tab" onclick="switchTab('settings')">⚙️ Settings</button>
                </div>
                
                <div style="margin-bottom: 30px;">
                    <h2 style="margin-bottom: 10px;">🔗 Match Lost & Found Items</h2>
                    <p style="color: #666; margin-bottom: 20px;">Find potential matches between lost and found items. Click to confirm matches.</p>
                    <div class="small" style="color: #667eea; font-weight: 600;">Potential Matches Found: <strong>${matchedPairs.length}</strong></div>
                </div>
                
                ${matchedPairs.length === 0 ? '<div style="padding:40px;text-align:center;background:#f5f5f5;border-radius:8px;color:#999;">No potential matches available. Post more items to see matching recommendations.</div>' : ''}
                
                ${matchedPairs.map((pair, idx) => {
                    const scorePercent = Math.round(pair.score * 100);
                    const scoreBgColor = scorePercent >= 80 ? '#d4edda' : scorePercent >= 60 ? '#fff3cd' : '#f8d7da';
                    const scoreBorderColor = scorePercent >= 80 ? '#28a745' : scorePercent >= 60 ? '#ffc107' : '#dc3545';

                    return `
                    <div style="background: white; border: 2px solid #eee; border-radius: 12px; padding: 20px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
                            <div>
                                <h3 style="margin: 0 0 5px 0; color: #333;">Match ${idx + 1}</h3>
                                <small style="color: #999;">Comparison ID: ${pair.lost.id} ↔ ${pair.found.id}</small>
                            </div>
                            <div style="background: ${scoreBgColor}; border: 2px solid ${scoreBorderColor}; padding: 10px 20px; border-radius: 8px; font-weight: 700; color: ${scoreBorderColor};">
                                Match Score: ${scorePercent}%
                            </div>
                        </div>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; align-items: start;">
                            <!-- Lost Item -->
                            <div style="background: linear-gradient(135deg, #fff5e6 0%, #ffe6e6 100%); padding: 20px; border-radius: 10px; border-left: 4px solid #f5576c;">
                                <div style="font-weight: 700; color: #f5576c; margin-bottom: 12px; font-size: 16px;">📌 LOST ITEM</div>
                                <div style="margin-bottom: 10px;">
                                    <strong style="color: #333;">Title:</strong> ${escapeHtml(pair.lost.title)}
                                </div>
                                <div style="margin-bottom: 10px;">
                                    <strong style="color: #333;">Category:</strong> ${escapeHtml(pair.lost.category)}
                                </div>
                                <div style="margin-bottom: 10px;">
                                    <strong style="color: #333;">Location:</strong> ${escapeHtml(pair.lost.location)}
                                </div>
                                <div style="margin-bottom: 10px;">
                                    <strong style="color: #333;">Date:</strong> ${pair.lost.date}
                                </div>
                                <div style="margin-bottom: 10px;">
                                    <strong style="color: #333;">Posted By:</strong> ${escapeHtml(pair.lost.user || 'Anonymous')}
                                </div>
                                <div style="margin-bottom: 15px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.1);">
                                    <strong style="color: #333;">Description:</strong><br>
                                    <small style="color: #666; line-height: 1.4;">${escapeHtml(pair.lost.description).substring(0, 100)}...</small>
                                </div>
                                ${pair.lost.photo ? `<div style="margin-top: 10px;"><img src="../${pair.lost.photo}" alt="Lost item" style="width:100%; border-radius:6px; max-height:150px; object-fit:cover;"></div>` : ''}
                            </div>
                            
                            <!-- Found Item -->
                            <div style="background: linear-gradient(135deg, #e6f7ff 0%, #e6ffe6 100%); padding: 20px; border-radius: 10px; border-left: 4px solid #4facfe;">
                                <div style="font-weight: 700; color: #4facfe; margin-bottom: 12px; font-size: 16px;">✅ FOUND ITEM</div>
                                <div style="margin-bottom: 10px;">
                                    <strong style="color: #333;">Title:</strong> ${escapeHtml(pair.found.title)}
                                </div>
                                <div style="margin-bottom: 10px;">
                                    <strong style="color: #333;">Category:</strong> ${escapeHtml(pair.found.category)}
                                </div>
                                <div style="margin-bottom: 10px;">
                                    <strong style="color: #333;">Location:</strong> ${escapeHtml(pair.found.location)}
                                </div>
                                <div style="margin-bottom: 10px;">
                                    <strong style="color: #333;">Date:</strong> ${pair.found.date}
                                </div>
                                <div style="margin-bottom: 10px;">
                                    <strong style="color: #333;">Posted By:</strong> ${escapeHtml(pair.found.user || 'Anonymous')}
                                </div>
                                <div style="margin-bottom: 15px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.1);">
                                    <strong style="color: #333;">Description:</strong><br>

                                ${Math.abs(new Date(pair.lost.date) - new Date(pair.found.date)) / (1000 * 60 * 60 * 24) <= 7 ? '<li style="padding: 5px 0; color: #666;"><span style="color: #28a745;">✓</span> Posted within same week</li>' : ''}

        function calculateMatchScore(lostItem, foundItem) {
            let score = 0;

            // Category match - high weight (0.4)
            if (lostItem.category === foundItem.category) score += 0.4;
            else if (lostItem.category.split(' ')[0] === foundItem.category.split(' ')[0]) score += 0.2;

            // Location match - medium weight (0.3)
            const lostLocationWords = lostItem.location.toLowerCase().split(' ');
            const foundLocationWords = foundItem.location.toLowerCase().split(' ');
            const locationMatches = lostLocationWords.filter(w => foundLocationWords.includes(w)).length;
            if (locationMatches > 0) score += 0.3 * (locationMatches / lostLocationWords.length);

            // Title similarity - medium weight (0.2)
            const lostTitleWords = lostItem.title.toLowerCase().split(' ');
            const foundTitleWords = foundItem.title.toLowerCase().split(' ');
            const titleMatches = lostTitleWords.filter(w => foundTitleWords.includes(w) && w.length > 3).length;
            if (titleMatches > 0) score += 0.2 * (titleMatches / Math.max(lostTitleWords.length, foundTitleWords.length));

            // Date proximity - low weight (0.1)
            const daysDiff = Math.abs(new Date(lostItem.date) - new Date(foundItem.date)) / (1000 * 60 * 60 * 24);
            if (daysDiff <= 7) score += 0.1 * (1 - daysDiff / 7);

            return Math.min(score, 1);
        }

        async function confirmMatch(lostId, foundId) {
            try {
                // Update lost item status
                const formLost = new FormData();
                formLost.append('item_id', lostId);
                formLost.append('status', 'Resolved');
                await fetch('admin_update_item_status.php', { method: 'POST', body: formLost });

                // Update found item status
                const formFound = new FormData();
                formFound.append('item_id', foundId);
                formFound.append('status', 'Resolved');
                await fetch('admin_update_item_status.php', { method: 'POST', body: formFound });

                logActivity(`Matched item #${lostId} with #${foundId}`);
                alert('✓ Match confirmed! Both items marked as Resolved.');
                renderMatchTab();
            } catch (error) {
                console.error('Error confirming match:', error);
                alert('Failed to confirm match. Please try again.');
            }
        }

                csv += `Export Date: ${new Date().toLocaleString()}\n`;
                csv += `Report Type: Full Database Export\n\n`;

                csv += `--- SYSTEM STATISTICS ---\n`;
                csv += `Total Submissions: ${stats.totalSubmissions}\n`;
                csv += `Lost Items: ${stats.lostItems}\n`;
                csv += `Found Items: ${stats.foundItems}\n`;

                csv += `--- ITEM SUBMISSIONS ---\n`;
                csv += `ID,Type,Title,Category,Location,Date,Contact Phone,Poster Name,Poster Email,Status,Posted At\n`;

                items.forEach(item => {

                    const row = [

                        `"${item.type}"`,
                        `"${(item.title || '').replace(/"/g, '""')}"`,

                        `"${status}"`,
                        `"${item.created_at || 'N/A'}"`
                    ].join(',');

                            <button class="btn" onclick="viewDetails(${item.id})" style="padding: 6px 12px; font-size: 12px;">View</button>
                            <button class="btn secondary" onclick="deleteItem(${item.id})" style="padding: 6px 12px; font-size: 12px;">Delete</button>
                        </td>
                    </tr>
                `).join('');
                document.getElementById('itemCount').textContent = items.length;
            }
        }

        async function editItem(id) {
            try {
                // We need to get the specific item data
                const response = await fetch('admin_get_all_items.php');
                const data = await response.json();

                if (!item) { alert('Item not found'); return; }

                const html = `
                    <div style="margin-bottom:20px">
                        <button class="btn" onclick="renderDashboard()">← Back</button>
                    </div>
                    <div style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto;">
                        <h3 style="margin-bottom: 25px; color: #333; text-align: center;">📝 Edit Item Details</h3>
                        <form id="editItemForm">
                            <input type="hidden" name="item_id" value="${item.id}">
                            
                            <div style="margin-bottom: 20px;">
                                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Title</label>
                                <input type="text" name="title" value="${escapeHtml(item.title)}" required style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 6px;">
                            </div>

                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                                <div>
                                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Type</label>
                                    <select name="type" required style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 6px;">
                                        <option value="lost" ${item.type.toLowerCase() === 'lost' ? 'selected' : ''}>Lost</option>
                                        <option value="found" ${item.type.toLowerCase() === 'found' ? 'selected' : ''}>Found</option>
                                    </select>
                                </div>
                                <div>
                                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Status</label>
                                    <select name="status" required style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 6px;">
                                        <option value="Pending" ${item.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                        <option value="Resolved" ${item.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
                                        <option value="Closed" ${item.status === 'Closed' ? 'selected' : ''}>Closed</option>
                                    </select>
                                </div>
                            </div>

                            <div style="margin-bottom: 20px;">
                                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Category</label>
                                <input type="text" name="category" value="${escapeHtml(item.category)}" required style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 6px;">
                            </div>

                            <div style="margin-bottom: 20px;">
                                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Location</label>
                                <input type="text" name="location" value="${escapeHtml(item.location)}" required style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 6px;">
                            </div>

                            <div style="margin-bottom: 25px;">
                                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Description</label>
                                <textarea name="description" required style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 6px; min-height: 100px;">${escapeHtml(item.description)}</textarea>
                            </div>

                            <div style="display: flex; gap: 10px;">
                                <button type="submit" class="btn" style="flex: 2; padding: 14px;">💾 Save Changes</button>
                                <button type="button" class="btn secondary" onclick="renderDashboard()" style="flex: 1; padding: 14px;">Cancel</button>
                            </div>
                        </form>
                    </div>
                `;
                document.getElementById('bodyContent').innerHTML = html;

                document.getElementById('editItemForm').addEventListener('submit', async function (e) {
                    e.preventDefault();
                    const formData = new FormData(this);

                    try {
                        const res = await fetch('admin_update_item.php', {
                            method: 'POST',
                            body: formData
                        });
                        const result = await res.json();

                        if (result.success) {
                            alert('✓ Item updated successfully!');
                            logActivity(`Admin updated item #${id}`);
                            renderDashboard();
                        } else {
                            alert('Failed to update: ' + result.message);
                        }
                    } catch (err) {
                        alert('Error updating item. Please try again.');
                    }
                });
            } catch (error) {
                console.error('Error in editItem:', error);
            }
        }

        function viewDetails(id) {
            const item = allSubmissions.find(i => i.id === id);
            if (!item) { alert('Item not found'); return; }
            const status = item.status || 'Pending';
            const html = `
                <div style="margin-bottom:20px">
                    <button class="btn" onclick="renderDashboard()">← Back</button>
                </div>
                <div class="item-details">
                    <div class="item-image">
                        ${item.photo ? `<img src="../${item.photo}" alt="Item photo">` : '<div class="item-image-placeholder">📷 No Photo Available</div>'}
                    </div>
                    <div class="item-info">
                        <h3>${escapeHtml(item.title)}</h3>
                        <div class="info-row"><span class="info-label">Category:</span> ${escapeHtml(item.category)}</div>
                        <div class="info-row"><span class="info-label">Type:</span> <span class="tag">${item.type}</span></div>
                        <div class="info-row"><span class="info-label">Status:</span> <span class="status-badge status-${status.toLowerCase()}">${status}</span></div>
                        <div class="info-row"><span class="info-label">📍 Location:</span> ${escapeHtml(item.location)}</div>
                        <div class="info-row"><span class="info-label">📅 Date:</span> ${item.date}</div>
                        <div class="info-row"><span class="info-label">Description:</span><br>${escapeHtml(item.description)}</div>
                        <div class="info-row"><span class="info-label">Contact:</span> ${escapeHtml(item.phone)}</div>
                        <div class="info-row"><span class="info-label">Posted By:</span> ${escapeHtml(item.user_name || 'Anonymous')} <span class="small">(${item.created_at || 'Date unavailable'})</span></div>
                        <div style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
                            <select onchange="setItemStatus(${item.id}, this.value)" style="padding: 10px 15px; border: 2px solid #667eea; border-radius: 5px; cursor: pointer; font-weight: 600;">
                                <option value="Pending" ${status === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Resolved" ${status === 'Resolved' ? 'selected' : ''}>Resolved</option>
                                <option value="Closed" ${status === 'Closed' ? 'selected' : ''}>Closed</option>
                            </select>
                            <button class="btn secondary" onclick="deleteItem(${item.id}); renderDashboard();" style="padding: 10px 15px;">Delete Item</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('bodyContent').innerHTML = html;
        }

        async function deleteItem(id) {
            if (!confirm('Delete this item?')) return;

            try {
                const formData = new FormData();
                formData.append('item_id', id);

                const response = await fetch('admin_delete_item.php', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    logActivity(`Item #${id} deleted`);
                    renderDashboard();
                } else {
                    alert('Failed to delete item: ' + data.message);
                }
            } catch (error) {
                console.error('Error deleting item:', error);
                alert('Failed to delete item. Please try again.');
            }
        }

        function escapeHtml(text) {
            if (!text && text !== 0) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }


        async function renderSettings() {
            currentTab = 'settings';
            const settings = JSON.parse(localStorage.getItem('adminSettings')) || {
                platformName: 'Lost & Found Platform',
                maintenanceMode: false,
                allowNewRegistrations: true,
                allowItemPosting: true,
                requireEmailVerification: false,
                autoArchiveAfterDays: 30
            };

            let usersCount = 0;
            try {
                const users = await getAllUsers();
                usersCount = users.length;
            } catch (e) {
                console.error("Error fetching users for settings:", e);
            }

            const html = `
                <div class="nav-tabs">
                    <button class="nav-tab" onclick="switchTab('submissions')">📋 Submissions</button>
                    <button class="nav-tab" onclick="switchTab('losters')">🔍 Losters</button>
                    <button class="nav-tab" onclick="switchTab('finders')">📦 Finders</button>
                    <button class="nav-tab" onclick="switchTab('match')">🔗 Match Items</button>
                    <button class="nav-tab" onclick="switchTab('analytics')">📊 Analytics</button>
                    <button class="nav-tab active" onclick="switchTab('settings')">⚙️ Settings</button>
                </div>
                
                <div style="margin-bottom: 30px;">
                    <h2 style="margin-bottom: 10px;">⚙️ System Settings</h2>
                    <p style="color: #666; margin-bottom: 20px;">Configure platform settings and admin preferences</p>
                </div>

                <div style="display: grid; gap: 20px;">
                    <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; border-radius: 12px;">
                        <h3 style="margin: 0 0 15px 0;">📛 Platform Settings</h3>
                        <div style="margin-bottom: 20px;">
                            <label style="color: white; margin-bottom: 8px; display: block; font-weight: 600;">Platform Name</label>
                            <input type="text" id="platformName" value="${escapeHtml(settings.platformName)}" style="width: 100%; padding: 10px 12px; border: none; border-radius: 6px; font-size: 14px;">
                        </div>
                        <div style="margin-bottom: 20px;">
                            <label style="color: white; display: flex; align-items: center; cursor: pointer; font-weight: 600;">
                                <input type="checkbox" id="maintenanceMode" ${settings.maintenanceMode ? 'checked' : ''} style="margin-right: 10px; cursor: pointer; width: 18px; height: 18px;">
                                <span>Maintenance Mode (closes platform to users)</span>
                            </label>
                        </div>
                        <div style="margin-bottom: 20px;">
                            <label style="color: white; display: flex; align-items: center; cursor: pointer; font-weight: 600;">
                                <input type="checkbox" id="allowNewRegistrations" ${settings.allowNewRegistrations ? 'checked' : ''} style="margin-right: 10px; cursor: pointer; width: 18px; height: 18px;">
                                <span>Allow New Registrations</span>
                            </label>
                        </div>
                        <div style="margin-bottom: 20px;">
                            <label style="color: white; display: flex; align-items: center; cursor: pointer; font-weight: 600;">
                                <input type="checkbox" id="allowItemPosting" ${settings.allowItemPosting ? 'checked' : ''} style="margin-right: 10px; cursor: pointer; width: 18px; height: 18px;">
                                <span>Allow Item Posting</span>
                            </label>
                        </div>
                        <div style="margin-bottom: 20px;">
                            <label style="color: white; display: flex; align-items: center; cursor: pointer; font-weight: 600;">
                                <input type="checkbox" id="requireEmailVerification" ${settings.requireEmailVerification ? 'checked' : ''} style="margin-right: 10px; cursor: pointer; width: 18px; height: 18px;">
                                <span>Require Email Verification</span>
                            </label>
                        </div>
                        <div style="margin-bottom: 20px;">
                            <label style="color: white; margin-bottom: 8px; display: block; font-weight: 600;">Auto Archive Items After (days)</label>
                            <input type="number" id="autoArchiveDays" value="${settings.autoArchiveAfterDays}" min="1" max="365" style="width: 100%; padding: 10px 12px; border: none; border-radius: 6px; font-size: 14px;">
                        </div>
                        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                            <button class="btn" onclick="saveSettings();" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); padding: 12px 24px; font-weight: 700;">
                                💾 Save Settings
                            </button>
                            <button class="btn secondary" onclick="resetSettings();" style="padding: 12px 24px; background: #e74c3c;">
                                ↻ Reset to Default
                            </button>
                        </div>
                    </div>

                    <div style="background: linear-gradient(135deg, #f5576c 0%, #fa7231 100%); color: white; padding: 25px; border-radius: 12px;">
                        <h3 style="margin: 0 0 15px 0;">⚠️ Danger Zone</h3>
                        <p style="margin: 0 0 15px 0; opacity: 0.9;">Irreversible actions. Use with caution!</p>
                        <button class="btn secondary" onclick="clearAllItems();" style="background: rgba(255,255,255,0.2); padding: 10px 16px; margin-bottom: 10px; font-size: 13px;">
                            🗑️ Clear All Items
                        </button>
                        <button class="btn secondary" onclick="clearActivityLog();" style="background: rgba(255,255,255,0.2); padding: 10px 16px; font-size: 13px;">
                            📜 Clear Activity Log
                        </button>
                    </div>

                    <div style="background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); padding: 25px; border-radius: 12px;">
                        <h3 style="margin: 0 0 15px 0; color: #333;">ℹ️ System Information</h3>
                        <div style="color: #666; font-size: 14px; line-height: 1.8;">
                            <div><strong>Platform Version:</strong> 1.0.0</div>
                            <div><strong>Total Items:</strong> ${JSON.parse(localStorage.getItem('items') || '[]').length}</div>
                            <div><strong>Total Users:</strong> ${usersCount}</div>
                            <div><strong>Storage Used:</strong> ${(JSON.stringify(localStorage).length / 1024).toFixed(2)} KB</div>
                            <div><strong>Last Backup:</strong> ${localStorage.getItem('lastBackup') || 'Never'}</div>
                        </div>
                        <button class="btn" onclick="createBackup();" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 10px 16px; margin-top: 15px; font-size: 13px;">

        function saveSettings() {
            const settings = {
                platformName: document.getElementById('platformName').value,
                maintenanceMode: document.getElementById('maintenanceMode').checked,
                allowNewRegistrations: document.getElementById('allowNewRegistrations').checked,
                allowItemPosting: document.getElementById('allowItemPosting').checked,
                requireEmailVerification: document.getElementById('requireEmailVerification').checked,
                autoArchiveAfterDays: parseInt(document.getElementById('autoArchiveDays').value)
            };
            localStorage.setItem('adminSettings', JSON.stringify(settings));
            logActivity('Admin settings updated');
            alert('✓ Settings saved successfully!');
            renderSettings();
        }

        function resetSettings() {
            if (!confirm('Reset all settings to default? This action cannot be undone.')) return;
            localStorage.removeItem('adminSettings');
            logActivity('Settings reset to default');
            alert('✓ Settings reset to default!');
            renderSettings();
        }

        function clearAllItems() {
            if (!confirm('Delete ALL items? This action cannot be undone.')) return;
            localStorage.removeItem('items');
            logActivity('All items cleared by admin');
            alert('✓ All items cleared!');
            renderSettings();
        }

        function clearActivityLog() {
            if (!confirm('Clear activity log? This action cannot be undone.')) return;
            localStorage.removeItem('adminActivityLog');
            logActivity = [];
            logActivity('Activity log cleared');
            alert('✓ Activity log cleared!');
            renderSettings();
        }

        function createBackup() {
            const backup = {
                items: JSON.parse(localStorage.getItem('items') || '[]'),
                users: JSON.parse(localStorage.getItem('users') || '[]'),
                adminLog: JSON.parse(localStorage.getItem('adminActivityLog') || '[]'),
                settings: JSON.parse(localStorage.getItem('adminSettings') || '{}'),
                timestamp: new Date().toLocaleString()
            };
            const dataStr = JSON.stringify(backup, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'backup_' + new Date().getTime() + '.json';
            link.click();
            localStorage.setItem('lastBackup', new Date().toLocaleString());
            logActivity('Backup created');
            alert('✓ Backup downloaded!');
        }

        function exportFullReport() {
            const items = JSON.parse(localStorage.getItem('items')) || [];
            const users = getAllUsers();
            const activityLog = JSON.parse(localStorage.getItem('adminActivityLog')) || [];

            let csv = 'LOST & FOUND PLATFORM - FULL REPORT\n';
            csv += 'Report Generated: ' + new Date().toLocaleString() + '\n\n';
            csv += 'PLATFORM STATISTICS\n';
            csv += 'Total Items: ' + items.length + '\n';
            csv += 'Lost Items: ' + items.filter(i => i.type === 'Lost').length + '\n';
            csv += 'Found Items: ' + items.filter(i => i.type === 'Found').length + '\n';
            csv += 'Total Users: ' + users.length + '\n';
            csv += 'Verified Users: ' + users.filter(u => u.verified).length + '\n\n';

            csv += 'RECENT ACTIVITIES\n';
            activityLog.forEach(log => {
                csv += '"' + log.timestamp + '","' + log.action.replace(/"/g, '""') + '"\n';
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'platform_report_' + new Date().getTime() + '.csv';
            link.click();
            logActivity('Full report exported');
        }
        function sendUserNotification(userName) {
            const message = prompt('Send message to ' + userName + ':', 'Enter your message here');
            if (!message) return;
            logActivity('Message sent to ' + userName + ': ' + message);
            alert('✓ Message sent to ' + userName + '!');
        }

        // Init
        window.addEventListener('load', () => {
            if (isAdminLogged()) renderDashboard(); else showLogin();
        });
    </script>
</body>

</html>
